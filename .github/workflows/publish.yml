name: Publish Farhan and The Hidden Work

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack website
        run: |
          mkdir -p site
          unzip -q website-source.zip -d site
          mkdir -p site/content/issues
          if [ -d content/issues ]; then
            cp content/issues/*.md site/content/issues/ 2>/dev/null || true
          fi
      - name: Install dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build website
        run: python site/scripts/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
